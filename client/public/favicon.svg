      <stop offset="1" stop-color="#f0418c" />
    </linearGradient>
  </defs>
  <circle cx="15" cy="15" r="14.5" fill="url(#f)" />
  <circle cx="10" cy="11.5" r="2.4" fill="#2a0e2f" />
  <circle cx="19" cy="11.5" r="2.4" fill="#2a0e2f" />
